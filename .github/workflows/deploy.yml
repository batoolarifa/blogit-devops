
name: BlogIt CI/CD Pipeline

on:
  # Run the pipeline whenever changes are pushed to main
  push:
    branches:
      - main

  # Allow the pipeline to be triggered manually from GitHub Actions
  workflow_dispatch:

jobs:
  # Current CI stage: build and publish Docker images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      # Get the latest repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Docker Buildx for image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with Docker Hub using GitHub repository secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build the backend image and push latest and commit-specific tags
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blogit-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blogit-backend:${{ github.sha }}

      # Build the frontend image and push latest and commit-specific tags
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blogit-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/blogit-frontend:${{ github.sha }}

