name: BlogIt CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blogit-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blogit-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blogit-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/blogit-frontend:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e

            cd /home/ubuntu/blogit

            echo "$DOCKER_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            export DOCKER_USERNAME

            docker compose -f docker-compose-prod.yml pull

            docker compose -f docker-compose-prod.yml up -d --remove-orphans

            docker logout

            docker image prune -af

            docker compose -f docker-compose-prod.yml ps
