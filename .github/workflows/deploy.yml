
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Clean and validate Docker Hub username
      - name: Prepare Docker Hub credentials
        id: docker-vars
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          CLEAN_USERNAME=$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]')

          if [ -z "$CLEAN_USERNAME" ]; then
            echo "ERROR: Docker username is empty!"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: Docker password is empty!"
            exit 1
          fi

          echo "username=$CLEAN_USERNAME" >> "$GITHUB_OUTPUT"

          echo "Docker username configured."
          echo "Username length: ${#CLEAN_USERNAME} characters."
          echo "Credentials validation passed."

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.docker-vars.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.docker-vars.outputs.username }}/blogit-backend:latest
            ${{ steps.docker-vars.outputs.username }}/blogit-backend:${{ github.sha }}

      # 5. Build and Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.docker-vars.outputs.username }}/blogit-frontend:latest
            ${{ steps.docker-vars.outputs.username }}/blogit-frontend:${{ github.sha }}
